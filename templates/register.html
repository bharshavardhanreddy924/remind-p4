{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="auth-container">
            <div class="card auth-card">
                <div class="auth-header text-center">
                    <div class="auth-icon">
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <h2 class="fw-bold">Create Account</h2>
                    <p class="mb-0">Join MemoryCare today</p>
                </div>
                <div class="auth-form">
                    <form method="POST" action="{{ url_for('register') }}">
                        <div class="mb-3">
                            <div class="position-relative">
                                <span class="position-absolute top-50 translate-middle-y ms-3 text-muted">
                                    <i class="fas fa-user"></i>
                                </span>
                                <input type="text" class="form-control ps-5 py-2" id="name" name="name" placeholder="Full Name" required style="border-radius: 12px; border: 1px solid #dee2e6;">
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="position-relative">
                                <span class="position-absolute top-50 translate-middle-y ms-3 text-muted">
                                    <i class="fas fa-envelope"></i>
                                </span>
                                <input type="email" class="form-control ps-5 py-2" id="email" name="email" placeholder="Email address" required style="border-radius: 12px; border: 1px solid #dee2e6;">
                            </div>
                        </div>
                        <div class="mb-4">
                            <div class="position-relative">
                                <span class="position-absolute top-50 translate-middle-y ms-3 text-muted">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" class="form-control ps-5 py-2" id="password" name="password" placeholder="Password" minlength="6" required style="border-radius: 12px; border: 1px solid #dee2e6;">
                            </div>
                            <div class="form-text ms-1 mt-1 text-muted" style="font-size: 0.8rem;">Password must be at least 6 characters</div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label ms-1 text-muted fw-bold">I am a:</label>
                            <div class="row">
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="user_type" id="user_type_user" value="user" autocomplete="off" checked>
                                    <label class="btn btn-outline-primary w-100 p-3 h-100 d-flex flex-column justify-content-center align-items-center" for="user_type_user" style="border-radius: 12px; border-width: 2px;">
                                        <i class="fas fa-user fa-2x mb-2"></i>
                                        <h6 class="mb-0 fw-bold">Patient</h6>
                                    </label>
                                </div>
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="user_type" id="user_type_caretaker" value="caretaker" autocomplete="off">
                                    <label class="btn btn-outline-primary w-100 p-3 h-100 d-flex flex-column justify-content-center align-items-center" for="user_type_caretaker" style="border-radius: 12px; border-width: 2px;">
                                        <i class="fas fa-user-md fa-2x mb-2"></i>
                                        <h6 class="mb-0 fw-bold">Caretaker</h6>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div id="caretakerEmail" class="mb-4 d-none">
                            <div class="position-relative">
                                <span class="position-absolute top-50 translate-middle-y ms-3 text-muted">
                                    <i class="fas fa-user-md"></i>
                                </span>
                                <input type="email" class="form-control ps-5 py-2" id="caretaker_email" name="caretaker_email" placeholder="Caretaker's Email (Optional)" style="border-radius: 12px; border: 1px solid #dee2e6;">
                            </div>
                            <div class="form-text ms-1 mt-1 text-muted" style="font-size: 0.8rem;">To let them manage your account</div>
                        </div>
                        <div class="d-grid mb-3 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg" style="border-radius: 12px;">
                                <i class="fas fa-user-plus me-2"></i> Register Account
                            </button>
                        </div>
                        <div class="text-center mt-3">
                            <p class="text-muted">Already have an account? <a href="{{ url_for('login') }}" class="fw-bold text-primary text-decoration-none">Login</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Show/hide caretaker email field based on user type
    document.addEventListener('DOMContentLoaded', function() {
        const userTypeRadios = document.querySelectorAll('input[name="user_type"]');
        const caretakerEmailField = document.getElementById('caretakerEmail');
        
        userTypeRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === 'user') {
                    caretakerEmailField.classList.remove('d-none');
                } else {
                    caretakerEmailField.classList.add('d-none');
                }
            });
        });
        
        // Initial check
        if (document.getElementById('user_type_user').checked) {
            caretakerEmailField.classList.remove('d-none');
        }
    });
</script>
{% endblock %}
