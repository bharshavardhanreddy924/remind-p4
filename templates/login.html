{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="auth-container">
            <div class="card auth-card">
                <div class="auth-header text-center">
                    <div class="auth-icon">
                        <i class="fas fa-brain"></i>
                    </div>
                    <h2 class="fw-bold">Welcome to MemoryCare</h2>
                    <p class="mb-0">Your personal memory assistant</p>
                </div>
                <div class="auth-form">
                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3 position-relative">
                            <span class="position-absolute top-50 translate-middle-y ms-3 text-muted">
                                <i class="fas fa-envelope"></i>
                            </span>
                            <input type="email" class="form-control ps-5 py-2" id="email" name="email" placeholder="Email address" required style="border-radius: 12px; border: 1px solid #dee2e6;">
                        </div>
                        <div class="mb-4 position-relative">
                            <span class="position-absolute top-50 translate-middle-y ms-3 text-muted">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" class="form-control ps-5 py-2" id="password" name="password" placeholder="Password" required style="border-radius: 12px; border: 1px solid #dee2e6;">
                        </div>
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-sign-in-alt me-2"></i> Login
                            </button>
                        </div>
                        <div class="text-center">
                            <p>Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
