{% extends 'base.html' %}

{% block title %}AI Assistant{% endblock %}

{% block extra_css %}
<style>
    /* Maximize chat space on mobile */
    footer { display: none !important; }
    
    @media (max-width: 767px) {
        body {
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            background-color: #f0f2f5;
        }
        .container.mt-4 {
            margin-top: 0 !important;
            padding: 15px !important;
            max-width: 100%;
            height: calc(100dvh - 60px);
        }
        .ai-assistant-container {
            height: 100%;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 1px solid rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .ai-header {
            padding-top: 16px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .chat-input-fixed {
            padding-bottom: 12px !important;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="ai-assistant-container">
    <div class="ai-header">
        <a href="{{ url_for('dashboard') }}" class="back-button">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1>AI Memory Assistant</h1>
    </div>
    
    <div id="chat-container" class="chat-container">
        <div id="chat-messages">
            <div class="chat-message assistant-message">
                Hello {{ user.name }}! I'm your AI memory assistant. How can I help you today?
            </div>
        </div>
    </div>
    
    <!-- Quick questions removed per user request -->    
    <div class="chat-input-fixed">
        <div class="d-flex">
            <input type="text" id="user-input" class="form-control" placeholder="Message AI..." autocomplete="off">
            <button type="button" class="btn btn-primary voice-input-button" id="voice-input-button" title="Voice Input">
                <i class="fas fa-microphone"></i>
            </button>
            <button type="button" class="btn btn-primary send-button" id="send-button" title="Send Message">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const voiceInputButton = document.getElementById('voice-input-button');
        const chatContainer = document.getElementById('chat-container');
        
        // Voice recognition and synthesis setup
        let recognition = null;
        let synthesis = window.speechSynthesis;
        let isListening = false;
        let isSpeaking = false;
        
        // Initialize Speech Recognition
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';
            
            recognition.onstart = function() {
                isListening = true;
                voiceInputButton.classList.add('listening');
                voiceInputButton.innerHTML = '<i class="fas fa-stop"></i>';
                showVoiceStatus('Listening... Speak now');
            };
            
            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                hideVoiceStatus();
                
                // Auto-send the message
                setTimeout(() => {
                    sendMessage();
                }, 500);
            };
            
            recognition.onerror = function(event) {
                console.error('Speech recognition error:', event.error);
                stopListening();
                
                let errorMsg = 'Voice input error';
                if (event.error === 'no-speech') {
                    errorMsg = 'No speech detected';
                } else if (event.error === 'not-allowed') {
                    errorMsg = 'Microphone access denied';
                }
                showVoiceStatus(errorMsg);
                setTimeout(hideVoiceStatus, 2000);
            };
            
            recognition.onend = function() {
                stopListening();
            };
        } else {
            // Disable voice button if not supported
            voiceInputButton.disabled = true;
            voiceInputButton.title = 'Voice not supported';
        }
        
        // Voice button click handler
        voiceInputButton.addEventListener('click', function() {
            if (!recognition) {
                alert('Voice recognition is not supported in your browser.');
                return;
            }
            
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        });
        
        function startListening() {
            try {
                recognition.start();
            } catch (error) {
                console.error('Error starting recognition:', error);
                showVoiceStatus('Could not start voice input');
                setTimeout(hideVoiceStatus, 2000);
            }
        }
        
        function stopListening() {
            isListening = false;
            voiceInputButton.classList.remove('listening');
            voiceInputButton.innerHTML = '<i class="fas fa-microphone"></i>';
            hideVoiceStatus();
            
            if (recognition) {
                try {
                    recognition.stop();
                } catch (error) {
                    console.error('Error stopping recognition:', error);
                }
            }
        }
        
        // Text-to-speech function
        function speakText(text) {
            // Stop any ongoing speech
            synthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            utterance.pitch = 1;
            utterance.volume = 1;
            utterance.lang = 'en-US';
            
            utterance.onstart = function() {
                isSpeaking = true;
                showVoiceStatus('Speaking...');
            };
            
            utterance.onend = function() {
                isSpeaking = false;
                hideVoiceStatus();
            };
            
            utterance.onerror = function(event) {
                console.error('Speech synthesis error:', event);
                isSpeaking = false;
                hideVoiceStatus();
            };
            
            synthesis.speak(utterance);
        }
        
        function showVoiceStatus(message) {
            let statusEl = document.getElementById('voice-status-indicator');
            if (!statusEl) {
                statusEl = document.createElement('div');
                statusEl.id = 'voice-status-indicator';
                statusEl.className = 'voice-status-indicator';
                document.body.appendChild(statusEl);
            }
            statusEl.textContent = message;
            statusEl.classList.add('show');
        }
        
        function hideVoiceStatus() {
            const statusEl = document.getElementById('voice-status-indicator');
            if (statusEl) {
                statusEl.classList.remove('show');
            }
        }
        
        // Enter key handler for text input
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !isListening) {
                sendMessage();
            }
        });

        // Send button click handler
        const sendButton = document.getElementById('send-button');
        if (sendButton) {
            sendButton.addEventListener('click', function() {
                if (!isListening) {
                    sendMessage();
                }
            });
        }
        
        // Store conversation history in memory
        let conversationHistory = [];
        
        function sendMessage() {
            const userMessage = userInput.value.trim();
            if (userMessage === '') return;
            
            // Add user message to chat
            addMessage(userMessage, 'user');
            
            // Add to conversation history
            conversationHistory.push({
                role: 'user',
                content: userMessage
            });
            
            // Keep only last 10 messages for context (5 exchanges)
            if (conversationHistory.length > 10) {
                conversationHistory = conversationHistory.slice(-10);
            }
            
            // Clear input
            userInput.value = '';
            
            // Show typing indicator
            const typingIndicator = document.createElement('div');
            typingIndicator.className = 'chat-message assistant-message typing-indicator';
            typingIndicator.textContent = 'Thinking...';
            chatMessages.appendChild(typingIndicator);
            
            // Scroll to bottom
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            // Send request to server with conversation history
            fetch('{{ url_for('ai_response') }}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify({
                    prompt: userMessage,
                    conversation_history: conversationHistory
                })
            })
            .then(response => response.json())
            .then(data => {
                // Remove typing indicator
                chatMessages.removeChild(typingIndicator);
                
                // Add AI response
                addMessage(data.response, 'assistant');
                
                // Speak the AI response
                speakText(data.response);
                
                // Add assistant response to conversation history
                conversationHistory.push({
                    role: 'assistant',
                    content: data.response
                });
                
                // Keep only last 10 messages
                if (conversationHistory.length > 10) {
                    conversationHistory = conversationHistory.slice(-10);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                // Remove typing indicator
                chatMessages.removeChild(typingIndicator);
                
                // Add error message
                addMessage('Sorry, I encountered an error. Please try again.', 'assistant');
            });
        }
        
        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${sender}-message`;
            messageDiv.textContent = text;
            
            chatMessages.appendChild(messageDiv);
            
            // Scroll to bottom
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    });
</script>
{% endblock %}
